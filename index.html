<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Theory</title>
  <meta name="description" content="Turn one color into a contrast-checked UI palette with accessible text pairs, seven app types and six harmonies.">
  <meta name="theme-color" content="#6366F1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Color Theory">
  <meta property="og:description" content="Turn one color into a contrast-checked UI palette with accessible text pairs, seven app types and six harmonies.">
  <meta property="og:image" content="screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles.css?v=15">
  <script src="color.js?v=15" defer></script>
  <script src="state.js?v=15" defer></script>
  <script src="schedule.js?v=15" defer></script>
  <script src="preview.js?v=15" defer></script>
  <script src="app.js?v=15" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Color Theory</h1>
      <p class="tagline">A usable scheme, fast.</p>
    </div>
    <div class="header-actions">
      <div id="theme-toggle" class="segmented" role="group" aria-label="Preview theme">
        <button id="theme-light" type="button" class="is-active" aria-pressed="true" aria-label="Preview: Light">Preview: Light</button>
        <button id="theme-dark" type="button" aria-pressed="false" aria-label="Preview: Dark">Preview: Dark</button>
      </div>
      <a class="icon-link" href="https://github.com/Paul-Chukwuemeka/color-theory"
         target="_blank" rel="noopener noreferrer" aria-label="Color Theory on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
      </a>
    </div>
  </header>

  <div id="mobile-strip" class="mobile-strip" aria-hidden="true"></div>

  <div class="layout">
    <aside class="rail" aria-label="Palette controls">
      <section class="panel">
        <h2 class="panel-title">App type</h2>
        <div id="app-type-list" class="chroma-list" role="group" aria-label="App type"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Base color</h2>
        <input id="hex-input" class="hex-input" type="text" value="#6366F1"
               spellcheck="false" autocomplete="off" aria-label="Hex color"
               aria-describedby="hex-error">
        <p id="hex-error" class="field-error" role="alert" hidden>Enter a 3- or 6-digit hex.</p>
        <p class="base-origin">
          <span class="base-origin-chip" id="base-origin-chip" aria-hidden="true"></span>
          <span id="base-origin-text"></span>
        </p>
        <div id="preset-grid" class="preset-grid" role="group" aria-label="Preset colors"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Harmony</h2>
        <div id="harmony-list" class="chroma-list" role="group" aria-label="Harmony rule"></div>
        <div class="dial">
          <div id="hue-ring" class="hue-ring" role="slider" tabindex="0"
               aria-label="Hue" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0">
            <div class="hue-ring-center"></div>
            <div id="hue-handle" class="hue-handle"></div>
          </div>
        </div>
        <div class="hue-controls">
          <label for="hue-slider">Hue</label>
          <input id="hue-slider" type="range" min="0" max="359" value="0" aria-label="Hue degrees">
          <input id="hue-value" class="hue-value" type="number" min="0" max="359" value="0"
                 aria-label="Hue value in degrees">
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Palette size</h2>
        <div class="size-row">
          <div class="size-control">
            <button id="size-minus" type="button" class="stepper" aria-label="One color fewer">&minus;</button>
            <input id="size-input" type="number" min="3" max="21" value="11" inputmode="numeric"
                   aria-label="Number of colors in the palette" aria-describedby="size-summary">
            <button id="size-plus" type="button" class="stepper" aria-label="One color more">+</button>
          </div>
          <p class="size-hint">
            <span id="size-summary">9 roles + 2 extras</span>
            <button id="size-auto" type="button" class="link-btn" hidden>Auto</button>
          </p>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Suggestions</h2>
        <div id="suggestions" class="suggestions"></div>
      </section>
    </aside>

    <main class="main">
      <section class="panel">
        <div class="toolbar">
          <h2 class="panel-title">Palette</h2>
          <button id="copy-all" type="button" class="btn btn-primary">Copy all</button>
        </div>
        <div id="swatch-row" class="swatch-row"></div>
        <div id="extras-row" class="extras-row"></div>
        <p id="palette-origin" class="palette-origin"></p>
      </section>

      <section class="panel">
        <h2 class="panel-title">Contrast</h2>
        <ul id="contrast-list" class="contrast-list"></ul>
      </section>

      <section class="panel">
        <h2 class="panel-title">In context</h2>
        <div id="preview-card" class="preview-card" aria-hidden="true"></div>
        <p id="preview-summary" class="sr-only"></p>
      </section>

      <section class="panel">
        <div class="toolbar toolbar-wrap">
          <h2 class="panel-title">Export</h2>
          <div class="toolbar-controls">
            <div id="export-format" class="segmented" role="group" aria-label="Export format">
              <button type="button" data-format="hex" class="is-active" aria-pressed="true">Hex</button>
              <button type="button" data-format="css" aria-pressed="false">CSS</button>
              <button type="button" data-format="tailwind" aria-pressed="false">Tailwind</button>
              <button type="button" data-format="json" aria-pressed="false">JSON</button>
            </div>
            <div id="export-themes" class="segmented" role="group" aria-label="Export themes">
              <button type="button" data-themes="light" class="is-active" aria-pressed="true">Light</button>
              <button type="button" data-themes="dark" aria-pressed="false">Dark</button>
              <button type="button" data-themes="both" aria-pressed="false">Both</button>
            </div>
            <button id="copy-export" type="button" class="btn">Copy</button>
          </div>
        </div>
        <pre id="export-output" class="export-output" tabindex="0" aria-label="Exported palette"></pre>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
